[[permission]]
identifier = "allow-get-bootstrap-state"
description = "Allows an application window to read non-sensitive bootstrap state."
commands.allow = ["get_bootstrap_state"]

[[permission]]
identifier = "allow-get-runtime-state"
description = "Allows an application window to read the privacy-safe runtime state."
commands.allow = ["get_runtime_state"]

[[permission]]
identifier = "allow-set-privacy-paused"
description = "Allows an application window to pause or resume the local runtime."
commands.allow = ["set_privacy_paused"]

[[permission]]
identifier = "allow-set-feature-enabled"
description = "Allows an application window to change an MVP runtime feature switch."
commands.allow = ["set_feature_enabled"]

[[permission]]
identifier = "allow-show-app-window"
description = "Allows an authorized application window to show an allowed AI Jarvis window."
commands.allow = ["show_app_window"]

[[permission]]
identifier = "allow-close-app-window"
description = "Allows an authorized application window to close an allowed AI Jarvis window."
commands.allow = ["close_app_window"]

[[permission]]
identifier = "allow-quit-app"
description = "Allows the control window to request an orderly AI Jarvis shutdown."
commands.allow = ["quit_app"]

[[permission]]
identifier = "allow-send-text-message"
description = "Allows an application window to submit one bounded direct chat message."
commands.allow = ["send_text_message"]

[[permission]]
identifier = "allow-get-chat-history"
description = "Allows an application window to read the current in-memory chat history."
commands.allow = ["get_chat_history"]

[[permission]]
identifier = "allow-clear-chat-history"
description = "Allows an application window to clear the current in-memory chat history."
commands.allow = ["clear_chat_history"]
