[package]
name = "ai-jarvis"
version = "0.1.0"
description = "Local-first AI desktop companion"
license = "Unlicense"
authors = ["AI Jarvis contributors"]
edition = "2021"
rust-version = "1.77.2"
default-run = "ai-jarvis"

[lib]
name = "ai_jarvis_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "ai-jarvis"
path = "src/main.rs"

[[bin]]
name = "asr_worker"
path = "src/bin/asr_worker.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
jsonschema = { version = "0.18.3", default-features = false }
minijinja = { version = "2.12.0", default-features = false, features = ["deserialization", "serde"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
base64 = "0.22"
png = "0.17.16"
futures-util = "0.3"
sha2 = "0.10"
sherpa-onnx = { version = "=1.13.7", default-features = false, features = ["shared"] }

[target.'cfg(windows)'.dependencies]
wasapi = "=0.24.0"
webrtc-vad = "=0.4.0"
windows-capture = "=1.2.0"
windows = { version = "0.56.0", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_StationsAndDesktops",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
