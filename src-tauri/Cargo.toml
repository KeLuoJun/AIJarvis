[package]
name = "ai-jarvis"
version = "0.1.0"
description = "Local-first AI desktop companion"
authors = ["AI Jarvis contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ai_jarvis_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "ai-jarvis"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
toml = "0.9"
