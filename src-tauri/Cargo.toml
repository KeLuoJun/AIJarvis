[package]
name = "ai-jarvis"
version = "0.1.0"
description = "Local-first AI desktop companion"
authors = ["AI Jarvis contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ai_jarvis_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "ai-jarvis"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
jsonschema = { version = "0.18.3", default-features = false }
minijinja = { version = "2.12.0", default-features = false, features = ["deserialization", "serde"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
base64 = "0.22"
