schema_version = 1

[[prompt]]
id = "observation"
system = "observation/system.md"
user = "observation/user.md.jinja"
schema = "../schemas/observation.schema.json"
required_variables = ["persona", "recent_responses", "audio_observations", "elapsed_since_previous", "current_scene", "active_session", "foreground_application", "foreground_window_title"]
max_output_tokens = 384
sampling_profile = "observation_non_thinking"

[[prompt]]
id = "scene_check"
system = "scene-check/system.md"
user = "scene-check/user.md"
schema = "../schemas/scene-check.schema.json"
required_variables = ["instruction", "audio_observations", "foreground_application", "foreground_window_title"]
max_output_tokens = 32
sampling_profile = "scene_check_non_thinking"

[[prompt]]
id = "course_summary"
system = "course-summary/system.md"
user = "course-summary/user.md.jinja"
schema = "../schemas/course-summary.schema.json"
required_variables = ["course_transcript", "course_images"]
max_output_tokens = 4096
sampling_profile = "default_non_thinking"

[[prompt]]
id = "direct_chat"
system = "direct-chat/system.md"
user = "direct-chat/user.md.jinja"
schema = "../schemas/direct-chat.schema.json"
required_variables = ["persona", "runtime_state", "conversation_history", "audio_observations", "foreground_application", "foreground_window_title", "has_screen_context", "user_message"]
max_output_tokens = 384
sampling_profile = "direct_chat_non_thinking"

[[prompt]]
id = "memory_extraction"
system = "memory-extraction/system.md"
user = "memory-extraction/user.md"
schema = "../schemas/memory-extraction.schema.json"
required_variables = ["user_message"]
max_output_tokens = 256
sampling_profile = "memory_extraction_non_thinking"
